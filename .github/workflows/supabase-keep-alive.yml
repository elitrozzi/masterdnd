name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 12 * * 1'  # Lunes a las 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://clgrrrpvhnwxrmxpfosq.supabase.co/auth/v1/health")
          echo "Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Supabase devolvió $STATUS — puede estar pausado"
            exit 1
          fi
          echo "Supabase activo OK"
